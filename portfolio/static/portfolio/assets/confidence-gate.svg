    <text x="286" y="227" text-anchor="middle" font-size="17">Closest</text><text x="286" y="249" text-anchor="middle" font-size="17">match</text>
    <text x="468" y="109" font-size="18" fill="#c4ecdd">Answer</text><text x="468" y="219" font-size="18" fill="#a5bec1">Fallback</text>
  </g>
</svg>
