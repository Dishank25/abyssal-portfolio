      <circle cx="111" cy="119" r="31"/><circle cx="315" cy="119" r="31"/><circle cx="512" cy="119" r="31"/>
    </g>
    <g stroke="#bbf6de" stroke-width="2.25">
      <path d="M95 114h32m-32 10h32"/>
      <path d="M298 121l11-13 12 16 13-11"/>
      <circle cx="298" cy="121" r="2.5" fill="#a8ead6"/><circle cx="309" cy="108" r="2.5" fill="#a8ead6"/><circle cx="321" cy="124" r="2.5" fill="#a8ead6"/><circle cx="334" cy="113" r="2.5" fill="#a8ead6"/>
      <path d="m500 123 8-8m-3 17 5-5m-1-22 4-4q5-5 10 0t0 10l-7 7m-4-1-5 5q-5 5-10 0t0-10l5-5"/>
