  <path fill="url(#marks)" opacity=".49" d="M0 0h640v330H0z"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#72bda9" stroke-width="2" d="M142 119h135"/>
    <path stroke="#72bda9" stroke-width="2" d="M349 119h127"/>
    <g stroke="#75b9b0" stroke-width="1.6">
